name: build-and-screenshot

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "config.json"
      - "build.bat"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (echo "MSVC not found" & exit /b 1)
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /O2 /EHsc src\main.cpp /Fe:FrostDock.exe /link user32.lib gdi32.lib shell32.lib dwmapi.lib /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup
          dir FrostDock.exe

      - name: Prepare colorful background
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $wall = "$env:USERPROFILE\frost-wall.png"
          $bmp = New-Object System.Drawing.Bitmap 1600, 900
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.FillRectangle([System.Drawing.Brushes]::Crimson, 0, 0, 800, 450)
          $g.FillRectangle([System.Drawing.Brushes]::RoyalBlue, 800, 0, 800, 450)
          $g.FillRectangle([System.Drawing.Brushes]::Orange, 0, 450, 800, 450)
          $g.FillRectangle([System.Drawing.Brushes]::SeaGreen, 800, 450, 800, 450)
          for ($i = 0; $i -lt 12; $i++) {
            $x = (Get-Random -Maximum 1500); $y = (Get-Random -Maximum 800)
            $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(160, (Get-Random -Maximum 256), (Get-Random -Maximum 256), (Get-Random -Maximum 256)))
            $g.FillEllipse($brush, $x, $y, 120, 120)
            $brush.Dispose()
          }
          $g.Dispose()
          $bmp.Save($wall, [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallPaper -Value $wall
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value '10'
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class Win { [DllImport("user32.dll")] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); }'
          [Win]::SystemParametersInfo(20, 0, $wall, 3) | Out-Null
          Start-Sleep -Seconds 2

      - name: Run and screenshot
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "screenshots" | Out-Null
          $proc = Start-Process -FilePath ".\FrostDock.exe" -WorkingDirectory (Get-Location) -PassThru
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $g.Dispose()
          $bmp.Save("$env:GITHUB_WORKSPACE\screenshots\frost-dock.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Item "screenshots\frost-dock.png" | Select-Object FullName, Length

      - name: Commit screenshot
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/frost-dock.png
          git commit -m "Add FrostDock effect screenshot [skip ci]" --allow-empty
          git push

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frost-dock-screenshot
          path: screenshots/frost-dock.png
